name: Build Mobile Applications

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB (Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x SMS-Native-Android/gradlew

      - name: Set up Android signing keystore
        working-directory: SMS-Native-Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/philmore-sms.p12
            echo "storeFile=philmore-sms.p12" > keystore.properties
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> keystore.properties
            echo "::notice::Android release signing configured from secrets"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - building unsigned APK/AAB"
          fi

      - name: Build Android Release APK & AAB
        working-directory: SMS-Native-Android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: SMS-Native-Android/app/build/outputs/apk/release/app-release*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: SMS-Native-Android/app/build/outputs/bundle/release/app-release.aab

      - name: Read built version
        id: version
        working-directory: SMS-Native-Android
        run: |
          VERSION_CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)
          VERSION_NAME=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Automated release built from commit ${{ github.sha }}
          - versionCode: ${{ steps.version.outputs.version_code }}
          - versionName: ${{ steps.version.outputs.version_name }}"
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists; skipping."
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              --title "PhilmoreSMS ${{ steps.version.outputs.version_name }}" \
              --notes "$NOTES" \
              SMS-Native-Android/app/build/outputs/apk/release/app-release*.apk \
              SMS-Native-Android/app/build/outputs/bundle/release/app-release.aab
          fi

  build-ios:
    name: Compile iOS App (React Native)
    runs-on: macos-14
    needs: build-android
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SMS-iOS/package.json

      - name: Install NPM Dependencies
        working-directory: SMS-iOS
        run: npm ci

      - name: Install CocoaPods Dependencies
        working-directory: SMS-iOS/ios
        run: |
          pod repo update
          pod install

      - name: Build Xcode Project (Simulator / Compile Check)
        working-directory: SMS-iOS/ios
        run: |
          xcodebuild -workspace PhilmoreSMS.xcworkspace \
                     -scheme PhilmoreSMS \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Zip iOS Build Product
        working-directory: SMS-iOS/ios
        run: zip -r PhilmoreSMS-Sim.zip build/Build/Products/Release-iphonesimulator/PhilmoreSMS.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: SMS-iOS/ios/PhilmoreSMS-Sim.zip

      - name: Upload iOS App to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: SMS-iOS/ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(git rev-list --count HEAD)"
          echo "Uploading iOS build to release $TAG"
          gh release upload "$TAG" PhilmoreSMS-Sim.zip --clobber
